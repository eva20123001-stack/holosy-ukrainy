Дмитро Яворницький — видатний історик, археолог та дослідник історії запорозького козацтва. Він присвятив життя збиранню старовинних речей, документів, пісень і переказів, пов'язаних із козацькою добою.

Цікавий факт: Яворницький зібрав велику колекцію козацьких старожитностей і передав її для збереження та вивчення музейній установі в Катеринославі, нині Дніпрі. Завдяки його праці багато свідчень про життя козаків збереглися для наступних поколінь.

Обидва вчені зробили важливий внесок у науку та збереження української культурної спадщини.`,
questions:[
{q:"Який саме внесок Івана Пулюя пов'язаний із ранніми рентгенівськими дослідженнями?",a:["Створення першого українського радіоприймача","Дослідження вакуумних ламп і отримання якісних рентгенівських знімків","Відкриття електричного струму"],correct:1},
{q:"Чому діяльність Дмитра Яворницького важлива для сучасних дослідників?",a:["Він створив першу українську газету","Він винайшов новий спосіб друку","Він збирав і зберігав матеріали про історію запорозького козацтва"],correct:2}
],
hint:"Ти вже майже на фініші. Знайди місце, де говорять про захист держави та громадянську відповідальність. Це кабінет «Захист України» на третьому поверсі."
},
{
title:"Фінальний етап",
type:"video",
url:"https://youtu.be/xsqLAbHtnao?si=CygiQYQRuUbLMmR5",
letter:"И",
questions:[
{q:"Яке спільне послання найкраще підсумовує весь квест?",a:["Історія та сучасність України пов'язані пам'яттю, відповідальністю і єдністю","Минуле не має значення для сьогодення","Захист країни залежить лише від однієї людини"],correct:0},
{q:"Що потрібно зробити після отримання всіх одинадцяти літер?",a:["Вибрати будь-яке слово","Скласти зібрані літери у фінальну фразу","Повернутися до першого етапу"],correct:1}
],
hint:"Вітаємо! Ти пройшов(ла) всі 11 етапів. Час зібрати літери та відкрити фінал."
}
];

const app=document.getElementById("app");
const params=new URLSearchParams(location.search);
const number=Number(params.get("qr")||0);
const KEY="holosyUkraine11Progress";

function completed(){
  try{return JSON.parse(localStorage.getItem(KEY)||"[]")}
  catch(e){return []}
}
function save(n){
  const c=completed();
  if(!c.includes(n))c.push(n);
  localStorage.setItem(KEY,JSON.stringify(c));
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function progressMarkup(n){
  return `<div class="progress-wrap">
    <div class="progress-info"><span>Твій шлях</span><span>Етап ${n} / 11</span></div>
    <div class="progress"><div class="progress-fill" style="width:${n/11*100}%"></div></div>
  </div>`;
}
function home(){
  const count=completed().length;
  app.innerHTML=`<section class="card">
    <div class="eyebrow-dark">Вітаємо у подорожі</div>
    <h2>Історія, що живе в кожному з нас</h2>
    <p>На тебе чекають 11 етапів, цікаві матеріали, історичні факти та завдання про Україну і її захисників.</p>
    <p>Скануй QR-коди по черзі, уважно виконуй завдання та збирай літери. Наприкінці на тебе чекатиме фінальна фраза і два бонуси від учителів.</p>
    <div class="fact"><b>Твоя місія:</b><br>Пройди всі етапи, збери одинадцять літер і відкрий головне послання квесту.</div>
    ${count?`<p class="small">Уже пройдено етапів: ${count} із 11</p>`:""}
    <a class="btn" href="?qr=1">Почати квест</a>
  </section>`;
}
function renderStage(n){
  const s=stages[n-1];
  if(!s){home();return}
  if(n>1&&!completed().includes(n-1)){
    app.innerHTML=`<section class="card">
      <div class="eyebrow-dark">Доступ обмежено</div>
      <h2>Цей етап ще закритий</h2>
      <p>Спочатку потрібно пройти попередній етап квесту. Рухайся послідовно, щоб зібрати всі літери.</p>
      <a class="btn" href="?qr=${n-1}">До попереднього етапу</a>
    </section>`;
    return;
  }
  const material=s.content
    ?`<div style="white-space:pre-line;line-height:1.8">${s.content}</div>${s.fact?`<div class="fact"><b>Цікавий факт</b><br>${s.fact}</div>`:""}`
    :`<p>Переглянь матеріал за посиланням:</p><a class="btn" href="${s.url}" target="_blank" rel="noopener">Відкрити матеріал ↗</a>`;
  app.innerHTML=`<section class="card">
    <div class="eyebrow-dark">Голоси України · Етап ${n}</div>
    <h2>${s.title}</h2>
    ${progressMarkup(n)}
    ${material}
    <hr>
    <h3>Перевір свої знання</h3>
    <p class="small">У кожному запитанні одна правильна відповідь. Варіанти відповідей перемішані.</p>
    <div id="questions"></div>
    <button id="check">Перевірити відповіді</button>
    <p id="feedback" aria-live="polite"></p>
    <div id="result"></div>
  </section>`;
  let answers={};
  const qbox=document.getElementById("questions");
  s.questions.forEach((q,i)=>{
    const choices=shuffle(q.a.map((text,j)=>({text,correct:j===q.correct})));
    let html=`<div class="question"><b>${i+1}. ${q.q}</b>`;
    choices.forEach((c,j)=>{
      html+=`<button type="button" class="option" data-q="${i}" data-right="${c.correct}">${String.fromCharCode(65+j)}. ${c.text}</button>`;
    });
    html+="</div>";
    qbox.innerHTML+=html;
  });
  qbox.querySelectorAll(".option").forEach(b=>{
    b.onclick=()=>{
      const i=b.dataset.q;
      answers[i]=b.dataset.right==="true";
      qbox.querySelectorAll(`[data-q="${i}"]`).forEach(x=>x.classList.remove("selected"));
      b.classList.add("selected");
    };
  });
  document.getElementById("check").onclick=()=>{
    if(Object.keys(answers).length!==2){
      document.getElementById("feedback").textContent="Дай відповідь на обидва запитання.";
      return;
    }
    if(!Object.values(answers).every(Boolean)){
      document.getElementById("feedback").textContent="Не всі відповіді правильні. Спробуй ще раз!";
      return;
    }
    save(n);
    document.getElementById("feedback").textContent="Чудово! Обидві відповіді правильні. Твоя літера:";
    document.getElementById("result").innerHTML=`
      <p class="letter">${s.letter}</p>
      <div class="hint"><b>Підказка до наступного QR-коду</b><br>${s.hint}</div>
      ${n<11?`<p>Тепер шукай QR-код №${n+1} у школі.</p>`:`<button type="button" onclick="finalPage()">Відкрити фінальне завдання</button>`}`;
    document.getElementById("check").disabled=true;
  };
}
function finalPage(){
  if(!stages.every((s,i)=>completed().includes(i+1))){
    app.innerHTML=`<section class="card"><h2>Ще не всі етапи пройдено</h2><p>Збери всі 11 літер, щоб відкрити фінал.</p></section>`;
    return;
  }
  app.innerHTML=`<section class="card">
    <div class="eyebrow-dark">Останнє випробування</div>
    <h2>Усі частини однієї історії</h2>
    <p>Ти зібрав(ла) всі одинадцять літер. Склади з них фразу, яка символізує силу нашої держави.</p>
    <p class="letter">С И Л А У К Р А Ї Н И</p>
    <input id="finalAnswer" placeholder="Введи фінальну фразу" autocomplete="off">
    <button type="button" onclick="checkFinal()">Перевірити</button>
    <p id="finalFeedback" aria-live="polite"></p>
  </section>`;
}
function checkFinal(){
  const input=document.getElementById("finalAnswer");
  const v=input.value.toUpperCase().replace(/[^А-ЯІЇЄҐ]/g,"");
  if(v==="СИЛАУКРАЇНИ"){
    app.innerHTML=`<section class="card">
      <div class="eyebrow-dark">Місію виконано</div>
      <h2>Вітаємо! Квест завершено!</h2>
      <p class="letter">СИЛА УКРАЇНИ</p>
      <p>Ти успішно пройшов(ла) всі 11 етапів квесту «Голоси України»!</p>
      <div class="final-bonus">
        <div class="eyebrow-dark">Бонус від учителя української мови</div>
        <h3>+1 бал</h3>
        <p>До контрольної роботи з української мови!</p>
      </div>
      <div class="final-bonus">
        <div class="eyebrow-dark">Бонус від учителя історії</div>
        <h3>+1 бал</h3>
        <p>З історії України!</p>
      </div>
      <hr>
      <h3>Дякуємо за участь!</h3>
      <p>Пам’ятаймо про тих, хто захищає Україну. Слава Збройним Силам України!</p>
    </section>`;
  }else{
    document.getElementById("finalFeedback").textContent="Спробуй ще раз. Уважно перестав усі зібрані літери.";
  }
}
if(number>=1&&number<=11)renderStage(number);
else home();
</script>
</body>
</html>
