let choices=shuffle(q.a.map((text,j)=>({text,correct:j===q.correct})));
let html=`<div class="question"><b>${i+1}. ${q.q}</b>`;
choices.forEach((c,j)=>{html+=`<button class="option" data-q="${i}" data-c="${j}" data-right="${c.correct}">${String.fromCharCode(65+j)}. ${c.text}</button>`});
html+="</div>";qbox.innerHTML+=html;
});
qbox.querySelectorAll(".option").forEach(b=>b.onclick=()=>{
let i=b.dataset.q;answers[i]=b.dataset.right==="true";
qbox.querySelectorAll(`[data-q="${i}"]`).forEach(x=>x.classList.remove("selected"));
b.classList.add("selected");
});
document.getElementById("check").onclick=()=>{
if(Object.keys(answers).length!==2){document.getElementById("feedback").textContent="Дай відповідь на обидва запитання.";return}
if(!Object.values(answers).every(Boolean)){
document.getElementById("feedback").textContent="Не всі відповіді правильні. Спробуй ще раз!";
return;
}
save(n);
document.getElementById("feedback").textContent="Чудово! Обидві відповіді правильні. Твоя літера:";
document.getElementById("result").innerHTML=`<p class="letter">${s.letter}</p><div class="hint"><b>Підказка до наступного QR-коду:</b><br>${s.hint}</div>${n<11?`<p>Тепер шукай QR-код №${n+1} у школі.</p>`:`<button onclick="finalPage()">Перейти до фіналу</button>`}`;
document.getElementById("check").disabled=true;
};
}

function finalPage(){
if(!stages.every((s,i)=>completed().includes(i+1))){
app.innerHTML=`<section class="card"><h2>Ще не всі етапи пройдено</h2><p>Збери всі 11 літер, щоб відкрити фінал.</p></section>`;return;
}
app.innerHTML=`<section class="card">
<h2>🎉 Фінальне завдання!</h2>
<p>Ти зібрав(ла) всі одинадцять літер. Склади з них фразу, яка символізує силу нашої держави.</p>
<p class="letter">С И Л А У К Р А Ї Н И</p>
<input id="finalAnswer" placeholder="Введи фінальну фразу">
<button onclick="checkFinal()">Перевірити</button>
<p id="finalFeedback"></p>
</section>`;
}
function checkFinal(){
let v=document.getElementById("finalAnswer").value.toUpperCase().replace(/[^А-ЯІЇЄҐ]/g,"");
if(v==="СИЛАУКРАЇНИ"){
app.innerHTML=`<section class="card">
<h2>🇺🇦 Вітаємо! Квест завершено!</h2>
<p class="letter">СИЛА УКРАЇНИ</p>
<p>Ти успішно пройшов(ла) всі 11 етапів квесту «Голоси України»!</p>
<div class="hint"><h3>🎟️ Бонус від учителя української мови</h3><p><b>+1 бал до контрольної роботи з української мови!</b></p></div>
<div class="fact"><h3>🎟️ Бонус від учителя історії</h3><p><b>+1 бал з історії України!</b></p></div>
<h3>Дякуємо за участь!</h3>
<p>Пам’ятаймо про тих, хто захищає Україну. Слава Збройним Силам України!</p>
</section>`;
}else{
document.getElementById("finalFeedback").textContent="Спробуй ще раз. Уважно перестав усі зібрані літери.";
}
}
if(number>=1&&number<=11)renderStage(number);else home();
</script>

</html>
